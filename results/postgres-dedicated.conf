# pg-limit-test, 8 GB RAM. Recorded in results/ after install.
listen_addresses = '10.130.0.4'
port = 5432
max_connections = 200
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 1GB
random_page_cost = 1.1
wal_level = replica
wal_compression = on
max_wal_size = 8GB
min_wal_size = 2GB
max_wal_senders = 10
max_replication_slots = 10
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
hot_standby = on
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 5000
log_checkpoints = on
log_line_prefix = '%m [%p] '
timezone = 'UTC'
lc_messages = 'C'
